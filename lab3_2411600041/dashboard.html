<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Grade Portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Chart.js CDN (Lab 4) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Toast container (Lab 4 real-time update notifications) -->
    <div id="toastContainer" class="toast-container-custom"></div>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Student Grade Portal</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <span class="navbar-text text-white me-3" id="userDisplay">
                                Welcome, <span id="userName">User</span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar vh-100 p-3">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Settings</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-danger" href="#" id="logoutLink">Logout</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

                <!-- Welcome Greeting -->
                <section>
                    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                        <h2 id="greeting">Good Morning, User!</h2>
                    </div>
                </section>

                <!-- Statistic Cards -->
                <section>
                    <div class="row mb-4">
                        <div class="col-md-3 mb-3">
                            <div class="card stat-card text-center">
                                <div class="card-body">
                                    <h5 class="card-title text-muted" id="stat1-title">GPA</h5>
                                    <h2 class="card-text fw-bold text-primary" id="stat1-value">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <div class="card stat-card text-center">
                                <div class="card-body">
                                    <h5 class="card-title text-muted" id="stat2-title">Courses</h5>
                                    <h2 class="card-text fw-bold text-success" id="stat2-value">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <div class="card stat-card text-center">
                                <div class="card-body">
                                    <h5 class="card-title text-muted" id="stat3-title">Assignment</h5>
                                    <h2 class="card-text fw-bold text-info" id="stat3-value">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <div class="card stat-card text-center">
                                <div class="card-body">
                                    <h5 class="card-title text-muted" id="stat4-title">Attendance</h5>
                                    <h2 class="card-text fw-bold text-warning" id="stat4-value">0%</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Charts (Lab 4: Interactive Data Visualization) -->
                <section>
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <div class="card">
                                <div class="card-body chart-container">
                                    <canvas id="performanceChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card">
                                <div class="card-body chart-container">
                                    <canvas id="attendanceChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card">
                                <div class="card-body chart-container">
                                    <canvas id="gpaTrendChart"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card">
                                <div class="card-body chart-container">
                                    <canvas id="statusDistributionChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Filter Controls (Lab 4) -->
                <section>
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-3">
                                    <label class="form-label small">Semester</label>
                                    <select id="semesterFilter" class="form-select">
                                        <option value="all">All Semesters</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small">Status</label>
                                    <select id="statusFilter" class="form-select">
                                        <option value="all">All Status</option>
                                        <option value="success">Success</option>
                                        <option value="warning">Warning</option>
                                        <option value="danger">Danger</option>
                                        <option value="info">Info</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small">Min Grade</label>
                                    <input type="number" id="minGrade" class="form-control" placeholder="0">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small">Max Grade</label>
                                    <input type="number" id="maxGrade" class="form-control" placeholder="100">
                                </div>
                                <div class="col-md-2 d-flex gap-2">
                                    <button id="applyGradeRange" class="btn btn-primary flex-grow-1">Apply</button>
                                    <button id="clearFilters" class="btn btn-outline-secondary">Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Search + Export (Lab 4) -->
                <section>
                    <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap">
                        <input type="text" id="searchBox" class="form-control" placeholder="Search activity...">
                        <button id="exportBtn" class="btn btn-success ms-2 text-nowrap"><i class="bi bi-download"></i> Export CSV</button>
                    </div>
                </section>

                <!-- Alerts (Lab 4) — scoped above the table, not the whole page -->
                <div id="alertSection" class="mb-2"></div>

                <!-- Recent Activity / Activity Table -->
                <section>
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Recent Activity</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr class="border-accent">
                                            <th id="sortDate" style="cursor:pointer">Date <i class="bi bi-arrow-down-up"></i></th>
                                            <th id="sortActivity" style="cursor:pointer">Activity <i class="bi bi-arrow-down-up"></i></th>
                                            <th id="sortStatus" style="cursor:pointer">Status <i class="bi bi-arrow-down-up"></i></th>
                                            <th>Grade</th>
                                        </tr>
                                    </thead>
                                    <tbody id="activityTableBody">
                                        <!-- Dynamic content will be inserted here by JavaScript -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript — load order matters: data layer, then charts, then dashboard logic -->
    <script src="js/dataManager.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
