<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Student Grade Portal</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="toastContainer" class="toast-container-custom"></div>

  <!-- Top navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark top-navbar">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Student Grade Portal</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white">Welcome, <span id="userNameNav">admin</span></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtnNav"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>
  </nav>

  <div class="d-flex">
    <!-- Sidebar -->
    <nav class="sidebar p-3" style="width: 240px; min-height: 100vh;">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person"></i> Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-gear"></i> Settings</a></li>
        <li class="nav-item"><a class="nav-link text-danger" href="#" id="logoutLink"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
      </ul>
    </nav>

    <!-- Main content -->
    <main class="flex-grow-1 p-4">
      <div class="mb-4">
        <h3 id="greeting">Good Day!</h3>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card stat-card border-accent">
            <div class="card-body">
              <div class="card-title" id="stat1-title">🎓 GPA</div>
              <div class="card-text fw-bold" id="stat1-value">0.00</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card stat-card border-accent">
            <div class="card-body">
              <div class="card-title" id="stat2-title">📚 Records</div>
              <div class="card-text fw-bold" id="stat2-value">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card stat-card border-accent">
            <div class="card-body">
              <div class="card-title" id="stat3-title">📝 Avg Grade</div>
              <div class="card-text fw-bold" id="stat3-value">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card stat-card border-accent">
            <div class="card-body">
              <div class="card-title" id="stat4-title">📅 Attendance</div>
              <div class="card-text fw-bold" id="stat4-value">96%</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts + Recent Activity -->
      <div class="row g-3 mb-4">
        <div class="col-lg-8">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="card">
                <div class="card-body chart-container">
                  <canvas id="performanceChart"></canvas>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card">
                <div class="card-body chart-container">
                  <canvas id="attendanceChart"></canvas>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card">
                <div class="card-body chart-container">
                  <canvas id="gpaTrendChart"></canvas>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card">
                <div class="card-body chart-container">
                  <canvas id="statusDistributionChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card h-100">
            <div class="card-header">
              <h6 class="mb-0"><i class="bi bi-clock-history"></i> Recent Activity</h6>
            </div>
            <ul class="list-group list-group-flush" id="recentActivityList">
              <!-- rows injected by dashboard.js -->
            </ul>
          </div>
        </div>
      </div>

      <!-- Filter Controls -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small">Semester</label>
              <select id="semesterFilter" class="form-select">
                <option value="all">All Semesters</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small">Status</label>
              <select id="statusFilter" class="form-select">
                <option value="all">All Status</option>
                <option value="success">Success</option>
                <option value="warning">Warning</option>
                <option value="danger">Danger</option>
                <option value="info">Info</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small">Min Grade</label>
              <input type="number" id="minGrade" class="form-control" placeholder="0">
            </div>
            <div class="col-md-2">
              <label class="form-label small">Max Grade</label>
              <input type="number" id="maxGrade" class="form-control" placeholder="100">
            </div>
            <div class="col-md-2 d-flex gap-2">
              <button id="applyGradeRange" class="btn btn-primary flex-grow-1">Apply</button>
              <button id="clearFilters" class="btn btn-outline-secondary">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Search + Export -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <input type="text" id="searchBox" class="form-control" placeholder="Search activity...">
        <button id="exportBtn" class="btn btn-success ms-2 text-nowrap"><i class="bi bi-download"></i> Export CSV</button>
      </div>

      <!-- Alerts — scoped to the table right below, not the whole page -->
      <div id="alertSection" class="mb-2"></div>

      <!-- Activity Table -->
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th id="sortDate" style="cursor:pointer">Date <i class="bi bi-arrow-down-up"></i></th>
                  <th id="sortActivity" style="cursor:pointer">Activity <i class="bi bi-arrow-down-up"></i></th>
                  <th id="sortStatus" style="cursor:pointer">Status <i class="bi bi-arrow-down-up"></i></th>
                  <th>Grade</th>
                </tr>
              </thead>
              <tbody id="activityTableBody">
                <!-- rows injected by dashboard.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bootstrap 5 JavaScript CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Load order matters: data layer, then charts, then the dashboard logic that ties them together -->
  <script src="js/dataManager.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
