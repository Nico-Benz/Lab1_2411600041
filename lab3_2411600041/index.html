<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Grade Portal</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">

      <div class="card login-card shadow-lg border-0">
        <div class="card-header login-card-header text-center">
          <div class="login-logo">🎓</div>
          <h4 class="mb-0">Student Grade Portal</h4>
          <p class="mb-0 small">Nico Benz A. Sasing</p>
        </div>

        <div class="card-body p-4">

          <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" placeholder="Enter username" autocomplete="off">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter password">
            </div>

            <button type="button" id="loginBtn" class="btn login-btn w-100">Log In</button>
          </form>

          <p class="text-center small text-muted mt-3 mb-0">
            Demo credentials: <strong>admin</strong> / <strong>password123</strong>
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
